# DRAFT — cloud-5a scaffold. NOT wired to fire automatically yet.
#
# This workflow deploys VELOCITY to Cloudflare Workers via OpenNext.
# It is intentionally inert until a maintainer opts in:
#
#   1. The job below is gated on the repo VARIABLE `CLOUDFLARE_DEPLOY_ENABLED`
#      being set to the literal string "true"
#      (Settings > Secrets and variables > Actions > Variables).
#      Until that variable exists, every step is skipped — pushing to main
#      will NOT deploy anything, even though the trigger below is
#      `on: push: branches: [main]` as requested.
#   2. Even with the gate open, the job will fail at the "wrangler" steps
#      until these repository SECRETS are added:
#        - CLOUDFLARE_API_TOKEN   (Workers + D1 + R2 edit scope)
#        - CLOUDFLARE_ACCOUNT_ID
#      Neither secret exists in this repo yet as of cloud-5a.
#   3. wrangler.jsonc still has PLACEHOLDER resource IDs (D1 database_id).
#      Those must be filled in with real IDs (created via `wrangler d1
#      create`, `wrangler r2 bucket create`, etc. — see cloud-5b) before a
#      real deploy will succeed even with the gate open and secrets set.
#
# See project docs / cloud-5a report for the full pre-deploy checklist.

name: Deploy to Cloudflare (VELOCITY)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build + deploy (OpenNext -> Cloudflare Workers)
    runs-on: ubuntu-latest
    # Hard gate — see header comment. Remove/flip this only when the repo
    # owner has deliberately opted in.
    if: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # wrangler / @opennextjs/cloudflare transitive deps (yargs 18,
          # eslint-visitor-keys 5) want Node >=20.19 / >=22.13 / >=24.
          # Use latest 22.x to satisfy both project engines (>=20.11) and
          # those transitive engine ranges.
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # --- QA gate (coordinate with qa-test-engineer) ---
      - name: Run tests
        run: npm test

      - name: Type-check / lint
        run: npm run lint

      # --- Cloudflare auth check (no mutation) ---
      - name: Wrangler whoami (sanity check)
        run: npx wrangler whoami
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # --- Database migrations (coordinate with database-architect) ---
      # Applies lib/db/migrations/*.sql (drizzle-kit generated) to the
      # REMOTE D1 database. This mutates production data — see the
      # migrations rollback plan in the cloud-5a report before enabling.
      - name: Apply D1 migrations (remote)
        run: npx wrangler d1 migrations apply velocity-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # --- Build ---
      - name: OpenNext build
        run: npx opennextjs-cloudflare build

      # --- Deploy (the actual irreversible action) ---
      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
